<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英検4級 合格クエスト</title>
  
  <!-- アプリ化（PWA）必須タグ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5260/5260505.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes bounce-slow {
      0%, 100% { transform: translateY(-5%); }
      50% { transform: translateY(5%); }
    }
    .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
      50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.9); }
    }
    .glow-gold { animation: pulse-gold 2s infinite; }
  </style>
</head>
<body class="bg-indigo-950 text-slate-100 min-h-screen pb-20 font-sans selection:bg-amber-400 selection:text-indigo-950 select-none">

  <!-- ヘッダー -->
  <header class="bg-indigo-900/90 backdrop-blur border-b border-indigo-700/50 sticky top-0 z-40 px-4 py-2.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚔️</span>
        <div>
          <h1 class="text-[10px] font-black tracking-wider text-amber-400 uppercase">Eiken Grade 4</h1>
          <div class="text-sm font-black text-white flex items-center gap-1">
            合格クエスト <span id="headerLevel" class="text-xs bg-amber-500 text-indigo-950 px-1.5 py-0.2 rounded font-black">Lv.1</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <button id="btnBgmToggle" onclick="toggleBGM()" class="bg-indigo-800 border border-indigo-600 px-2.5 py-1 rounded-full text-slate-300 font-bold active:scale-95 transition">
          🎵 OFF
        </button>
        <div class="bg-indigo-950/80 border border-indigo-700 px-2 py-1 rounded-full flex items-center gap-1 font-bold text-amber-300">
          🔥 <span id="streakCount">0</span>
        </div>
        <div class="bg-indigo-950/80 border border-indigo-700 px-2 py-1 rounded-full flex items-center gap-1 font-bold text-emerald-400">
          💎 <span id="gemCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- 1. ホーム画面 -->
    <div id="viewHome" class="space-y-4">
      <div class="bg-gradient-to-br from-indigo-800 via-indigo-900 to-purple-900 border-2 border-indigo-600 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
        <div class="flex items-center gap-4">
          <div class="relative">
            <div id="heroAvatar" class="w-20 h-20 rounded-2xl bg-indigo-950/60 border-2 border-amber-400 flex items-center justify-center text-4xl shadow-inner animate-bounce-slow">🐣</div>
            <span id="heroRank" class="absolute -bottom-2 -right-1 text-[10px] font-black bg-gradient-to-r from-amber-500 to-yellow-300 text-indigo-950 px-2 py-0.5 rounded-full shadow">見習い</span>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-baseline mb-1">
              <h2 id="heroName" class="font-black text-base text-white truncate">タマゴン</h2>
              <span id="levelLabel" class="text-xs font-black text-amber-400">Lv.1</span>
            </div>
            <div class="w-full bg-indigo-950/80 rounded-full h-3 border border-indigo-700 overflow-hidden mb-1">
              <div id="expBar" class="bg-gradient-to-r from-amber-400 to-yellow-300 h-full w-0 transition-all duration-500"></div>
            </div>
            <div class="flex justify-between text-[10px] text-indigo-300 font-bold">
              <span>EXP</span><span id="expText">0 / 100</span>
            </div>
          </div>
        </div>
        <div class="mt-4 pt-3 border-t border-indigo-700/50 flex justify-between items-center text-xs">
          <span class="text-indigo-200">🎯 10月試験まで あと</span>
          <span id="countdownDays" class="font-black text-amber-300 text-sm">-- 日</span>
        </div>
      </div>

      <div class="bg-indigo-900/60 border border-indigo-800 rounded-2xl p-4 shadow-lg">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-sm text-amber-400 flex items-center gap-1.5">📜 今日のクエスト</h3>
          <span id="dailyProgressText" class="text-xs text-indigo-300 font-bold">0/3 完了</span>
        </div>
        <div class="space-y-2 text-xs">
          <div class="bg-indigo-950/70 border border-indigo-700/60 p-3 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="text-lg">📖</span>
              <div><div class="font-bold text-slate-200">重要単語 5問</div><div class="text-[10px] text-amber-400 font-semibold">+30 EXP / 💎+5</div></div>
            </div>
            <button onclick="startMode('vocab', 5)" class="bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black px-3 py-1.5 rounded-lg transition active:scale-95">挑戦</button>
          </div>
          <div class="bg-indigo-950/70 border border-indigo-700/60 p-3 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="text-lg">🪄</span>
              <div><div class="font-bold text-slate-200">文法・会話 3問</div><div class="text-[10px] text-amber-400 font-semibold">+30 EXP / 💎+5</div></div>
            </div>
            <button onclick="startMode('grammar', 3)" class="bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black px-3 py-1.5 rounded-lg transition active:scale-95">挑戦</button>
          </div>
          <div class="bg-indigo-950/70 border border-indigo-700/60 p-3 rounded-xl flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="text-lg">🎧</span>
              <div><div class="font-bold text-slate-200">リスニング 3問</div><div class="text-[10px] text-amber-400 font-semibold">+40 EXP / 💎+10</div></div>
            </div>
            <button onclick="startMode('listening', 3)" class="bg-amber-500 hover:bg-amber-400 text-indigo-950 font-black px-3 py-1.5 rounded-lg transition active:scale-95">挑戦</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="startMode('vocab', 10)" class="bg-gradient-to-br from-blue-600 to-indigo-700 p-4 rounded-2xl border border-blue-400/40 text-left shadow-lg transition active:scale-95">
          <div class="text-2xl mb-1">📚</div><div class="font-black text-sm text-white">単語バトル</div><div class="text-[10px] text-blue-200 mt-0.5">でる順 4級単語</div>
        </button>
        <button onclick="startWeakMode()" class="bg-gradient-to-br from-rose-600 to-red-700 p-4 rounded-2xl border border-rose-400/40 text-left shadow-lg transition active:scale-95">
          <div class="text-2xl mb-1">👾</div><div class="font-black text-sm text-white">にがて討伐</div><div class="text-[10px] text-rose-200 mt-0.5">復習 (<span id="weakBadgeCount">0</span>問)</div>
        </button>
      </div>
    </div>

    <!-- 2. バトル画面 -->
    <div id="viewQuiz" class="hidden space-y-4">
      <div class="flex items-center justify-between bg-indigo-900/70 p-3 rounded-2xl border border-indigo-800">
        <button onclick="confirmExitQuiz()" class="text-xs font-bold text-indigo-300 hover:text-white px-2 py-1 bg-indigo-950 rounded-lg">✕ にげる</button>
        <div class="text-xs font-bold text-amber-400" id="quizProgress">第 1 / 5 問</div>
        <div class="text-xs font-black text-yellow-300 bg-amber-500/20 border border-amber-500/40 px-2 py-0.5 rounded-full" id="comboCounter">🔥 0 連続</div>
      </div>

      <div class="bg-gradient-to-b from-indigo-900 to-indigo-950 border-2 border-indigo-700 rounded-3xl p-5 shadow-2xl relative">
        <div class="flex flex-col items-center justify-center mb-4">
          <div id="enemyAvatar" class="text-5xl mb-2 animate-bounce-slow">👹</div>
          <div class="w-32 bg-indigo-950 rounded-full h-2 border border-indigo-700 mt-1 overflow-hidden">
            <div id="enemyHpBar" class="bg-rose-500 h-full w-full transition-all duration-300"></div>
          </div>
        </div>
        <div class="flex justify-center mb-3">
          <button onclick="playCurrentAudio()" class="bg-indigo-800 hover:bg-indigo-700 border border-indigo-500 text-amber-300 text-xs font-bold py-1.5 px-4 rounded-full flex items-center gap-1.5 shadow transition active:scale-95">
            🔊 音声をきく
          </button>
        </div>
        <div class="text-center min-h-[60px] flex items-center justify-center px-2 mb-2">
          <p id="quizQuestion" class="text-lg font-black text-white leading-snug"></p>
        </div>
        <p id="quizSubText" class="text-center text-xs text-indigo-300 font-medium min-h-[18px]"></p>
      </div>

      <div id="quizOptions" class="grid grid-cols-1 gap-2.5"></div>

      <div id="quizFeedback" class="hidden bg-indigo-900 border-2 border-amber-400 p-4 rounded-2xl space-y-2 shadow-2xl">
        <div class="flex items-center gap-2">
          <span id="feedbackIcon" class="text-2xl">⭕</span>
          <h4 id="feedbackTitle" class="text-base font-black text-amber-300"></h4>
        </div>
        <p id="feedbackExplain" class="text-xs text-slate-200 leading-relaxed"></p>
        <button onclick="nextQuestion()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-400 text-indigo-950 font-black py-2.5 rounded-xl text-sm shadow-lg hover:brightness-110 active:scale-95 transition">
          つぎへ ➔
        </button>
      </div>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="viewResult" class="hidden space-y-4 text-center py-4">
      <div class="bg-gradient-to-b from-indigo-800 to-indigo-950 border-2 border-amber-400 rounded-3xl p-6 shadow-2xl space-y-4 glow-gold">
        <div class="text-6xl animate-bounce">🏆</div>
        <div>
          <h3 class="text-xl font-black text-amber-300">クエストクリア！</h3>
        </div>
        <div class="grid grid-cols-3 gap-2 bg-indigo-950/80 p-3 rounded-2xl border border-indigo-700 text-xs">
          <div><div class="text-indigo-400 text-[10px] font-bold">正解数</div><div id="resultScore" class="font-black text-base text-white"></div></div>
          <div><div class="text-indigo-400 text-[10px] font-bold">獲得EXP</div><div id="resultExp" class="font-black text-base text-amber-400"></div></div>
          <div><div class="text-indigo-400 text-[10px] font-bold">獲得ダイヤ</div><div id="resultGems" class="font-black text-base text-emerald-400"></div></div>
        </div>
        <button onclick="showHome()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-400 text-indigo-950 font-black py-3 rounded-xl text-sm shadow-lg active:scale-95 transition">
          拠点にもどる 🏠
        </button>
      </div>
    </div>
  </main>

  <script>
    // ======= PWA Service Worker 登録 =======
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW登録失敗:', err));
      });
    }

    // ======= 問題データ =======
    const QUESTION_BANK = [
      { id: 'v1', type: 'vocab', q: 'listen to ~', sub: 'この熟語の意味は？', options: ['〜を見る', '〜を聞く', '〜を話す', '〜を書く'], ans: 1, explain: 'listen to ~ で「〜を聞く」という意味です。', audio: 'listen to' },
      { id: 'v2', type: 'vocab', q: 'look for ~', sub: 'この熟語の意味は？', options: ['〜をさがす', '〜の世話をする', '〜を見る', '〜に似ている'], ans: 0, explain: 'look for ~ で「〜をさがす」という意味です。', audio: 'look for' },
      { id: 'v3', type: 'vocab', q: 'library', sub: 'この単語の意味は？', options: ['図書館', '病院', '駅', '公園'], ans: 0, explain: 'library は「図書館」という意味です。', audio: 'library' },
      { id: 'v4', type: 'vocab', q: 'yesterday', sub: 'この単語の意味は？', options: ['あした', 'きのう', 'きょう', '来週'], ans: 1, explain: 'yesterday は「昨日（きのう）」という意味です。', audio: 'yesterday' },
      { id: 'g1', type: 'grammar', q: 'I ( ) to the park yesterday.', sub: 'カッコに入る正しい言葉は？', options: ['go', 'went', 'going', 'goes'], ans: 1, explain: 'yesterday（昨日）があるので過去形の went が正解です。', audio: 'I went to the park yesterday.' },
      { id: 'g2', type: 'grammar', q: 'A: ( ) is your birthday?\nB: It is May 5th.', sub: '誕生日をたずねる疑問詞は？', options: ['Where', 'Who', 'When', 'What'], ans: 2, explain: '日付をたずねているので When（いつ）が正解です。', audio: 'When is your birthday?' },
      { id: 'l1', type: 'listening', q: '音声を聞いて、適切な応答を選ぼう。\n"What time do you usually get up?"', sub: '対話の返答を選んでください', options: ['At seven o\'clock.', 'By bus.', 'Yes, I do.', 'In my room.'], ans: 0, explain: 'What time（何時？）と聞かれているので「7時です」と答えます。', audio: 'What time do you usually get up?' },
      { id: 'l2', type: 'listening', q: '音声を聞いて、適切な応答を選ぼう。\n"May I help you?"', sub: 'お店での会話に答えよう', options: ['Yes, I am.', 'No, thank you. I\'m just looking.', 'Here you are.', 'You\'re welcome.'], ans: 1, explain: '「いらっしゃいませ」に対して「見ているだけです」と答えます。', audio: 'May I help you?' }
    ];

    // ======= BGM & SE エンジン =======
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let isBgmEnabled = false;
    let bgmTimer = null;
    let currentSequence = [];
    let currentStep = 0;
    
    // ピッチ変換
    const noteFreq = { 'G3':196, 'A3':220, 'C4':261.6, 'D4':293.7, 'E4':329.6, 'F4':349.2, 'G4':392.0, 'A4':440.0, 'B4':493.9, 'C5':523.3, 'D5':587.3, 'E5':659.3, 'G5':784.0, 'C6':1046.5 };

    const BGM_DATA = {
      home: { seq: ['C4',null,'E4',null,'G4',null,'C5',null,'G4',null,'E4',null], speed: 300, type: 'triangle', vol: 0.03 },
      battle: { seq: ['A3','A3','C4','E4','D4','D4','F4','G4'], speed: 180, type: 'square', vol: 0.02 },
      result: { seq: ['C5','D5','E5','G5','C6','G5','E5','D5'], speed: 150, type: 'sine', vol: 0.04 }
    };

    function initAudio() {
      if(!actx) actx = new AudioContext();
      if(actx.state === 'suspended') actx.resume();
    }

    function toggleBGM() {
      initAudio();
      isBgmEnabled = !isBgmEnabled;
      document.getElementById('btnBgmToggle').innerHTML = isBgmEnabled ? '🎵 ON' : '🎵 OFF';
      document.getElementById('btnBgmToggle').className = isBgmEnabled 
        ? "bg-amber-500 border border-amber-400 px-2.5 py-1 rounded-full text-indigo-950 font-black active:scale-95 transition"
        : "bg-indigo-800 border border-indigo-600 px-2.5 py-1 rounded-full text-slate-300 font-bold active:scale-95 transition";
      
      if(isBgmEnabled) playBGM('home');
      else stopBGM();
    }

    function playBGM(scene) {
      if(!isBgmEnabled) return;
      stopBGM();
      const track = BGM_DATA[scene];
      currentSequence = track.seq;
      currentStep = 0;
      
      function schedule() {
        if(isBgmEnabled && currentSequence.length > 0) {
          const note = currentSequence[currentStep % currentSequence.length];
          if(note) {
            const osc = actx.createOscillator();
            const gain = actx.createGain();
            osc.type = track.type;
            osc.frequency.value = noteFreq[note];
            osc.connect(gain);
            gain.connect(actx.destination);
            gain.gain.setValueAtTime(track.vol, actx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + (track.speed/1000)*0.8);
            osc.start(actx.currentTime);
            osc.stop(actx.currentTime + (track.speed/1000));
          }
          currentStep++;
          bgmTimer = setTimeout(schedule, track.speed);
        }
      }
      schedule();
    }

    function stopBGM() {
      clearTimeout(bgmTimer);
      currentSequence = [];
    }

    function playSE(type) {
      if(!actx) return;
      const now = actx.currentTime;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.connect(gain);
      gain.connect(actx.destination);

      if(type === 'correct') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(783.99, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if(type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(196, now + 0.15);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(text);
      uttr.lang = 'en-US';
      uttr.rate = 0.85;
      window.speechSynthesis.speak(uttr);
    }

    // ======= ユーザーデータ管理 =======
    let userData = { level: 1, exp: 0, gems: 0, weakList: [] };
    const AVATARS = [{ minLv: 1, emoji: '🐣', rank: '見習い', name: 'タマゴン' }, { minLv: 5, emoji: '🐥', rank: '勇者', name: 'バードン' }];

    function loadData() {
      const saved = localStorage.getItem('eiken4_data_v2');
      if (saved) userData = { ...userData, ...JSON.parse(saved) };
      updateUiState();
    }

    function saveData() {
      localStorage.setItem('eiken4_data_v2', JSON.stringify(userData));
      updateUiState();
    }

    function updateUiState() {
      document.getElementById('headerLevel').innerText = `Lv.${userData.level}`;
      document.getElementById('levelLabel').innerText = `Lv.${userData.level}`;
      document.getElementById('gemCount').innerText = userData.gems;
      document.getElementById('weakBadgeCount').innerText = userData.weakList.length;

      const needed = userData.level * 100;
      document.getElementById('expBar').style.width = `${Math.min(100, (userData.exp / needed) * 100)}%`;
      document.getElementById('expText').innerText = `${userData.exp} / ${needed}`;

      const examDate = new Date(2026, 9, 4); // 2026年10月4日
      const daysLeft = Math.max(0, Math.ceil((examDate - new Date()) / (1000 * 60 * 60 * 24)));
      document.getElementById('countdownDays').innerText = `${daysLeft} 日`;
    }

    // ======= クイズロジック =======
    let currentQueue = [], currentIndex = 0, score = 0, combo = 0;
    const MONSTERS = ['👹', '👾', '🐲'];

    function startMode(type, count) {
      initAudio();
      let pool = QUESTION_BANK.filter(q => q.type === type);
      currentQueue = pool.sort(() => 0.5 - Math.random()).slice(0, count);
      startSession();
    }

    function startWeakMode() {
      initAudio();
      if(userData.weakList.length === 0) return alert('にがてリストはありません！');
      currentQueue = QUESTION_BANK.filter(q => userData.weakList.includes(q.id));
      startSession();
    }

    function startSession() {
      currentIndex = 0; score = 0; combo = 0;
      document.getElementById('viewHome').classList.add('hidden');
      document.getElementById('viewResult').classList.add('hidden');
      document.getElementById('viewQuiz').classList.remove('hidden');
      playBGM('battle');
      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQueue[currentIndex];
      document.getElementById('quizFeedback').classList.add('hidden');
      document.getElementById('quizProgress').innerText = `第 ${currentIndex + 1} / ${currentQueue.length} 問`;
      document.getElementById('comboCounter').innerText = `🔥 ${combo} 連続`;
      document.getElementById('enemyAvatar').innerText = MONSTERS[currentIndex % MONSTERS.length];
      document.getElementById('enemyHpBar').style.width = '100%';
      document.getElementById('quizQuestion').innerText = q.q;
      document.getElementById('quizSubText').innerText = q.sub || '';

      const optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full bg-indigo-900/90 hover:bg-indigo-800 border-2 border-indigo-700/80 p-3.5 rounded-2xl font-bold text-left";
        btn.innerHTML = `<strong class="text-amber-400 mr-2">${idx + 1}.</strong> ${opt}`;
        btn.onclick = () => handleAnswer(idx);
        optContainer.appendChild(btn);
      });
      if(q.audio) speakText(q.audio);
    }

    function playCurrentAudio() {
      if(currentQueue[currentIndex].audio) speakText(currentQueue[currentIndex].audio);
    }

    function handleAnswer(idx) {
      const q = currentQueue[currentIndex];
      const isCorrect = (idx === q.ans);
      
      Array.from(document.getElementById('quizOptions').children).forEach((btn, i) => {
        btn.disabled = true;
        if(i === q.ans) btn.classList.add('!bg-emerald-700');
        if(i === idx && !isCorrect) btn.classList.add('!bg-rose-800');
      });

      if(isCorrect) {
        playSE('correct');
        score++; combo++;
        document.getElementById('enemyHpBar').style.width = '0%';
        userData.weakList = userData.weakList.filter(id => id !== q.id);
        document.getElementById('feedbackTitle').innerText = '正解！ Great!';
        document.getElementById('feedbackTitle').className = "text-base font-black text-emerald-400";
      } else {
        playSE('wrong');
        combo = 0;
        if(!userData.weakList.includes(q.id)) userData.weakList.push(q.id);
        document.getElementById('feedbackTitle').innerText = 'おしい！ Review';
        document.getElementById('feedbackTitle').className = "text-base font-black text-rose-400";
      }
      
      document.getElementById('feedbackExplain').innerText = q.explain;
      document.getElementById('quizFeedback').classList.remove('hidden');
      saveData();
    }

    function nextQuestion() {
      currentIndex++;
      if(currentIndex < currentQueue.length) renderQuestion();
      else finishSession();
    }

    function finishSession() {
      document.getElementById('viewQuiz').classList.add('hidden');
      document.getElementById('viewResult').classList.remove('hidden');
      playBGM('result');

      const exp = score * 10;
      document.getElementById('resultScore').innerText = `${score} / ${currentQueue.length}`;
      document.getElementById('resultExp').innerText = `+${exp}`;
      document.getElementById('resultGems').innerText = `💎+${score}`;
      
      userData.gems += score;
      userData.exp += exp;
      if(userData.exp >= userData.level * 100) {
        userData.exp = 0;
        userData.level++;
      }
      saveData();
    }

    function showHome() {
      document.getElementById('viewQuiz').classList.add('hidden');
      document.getElementById('viewResult').classList.add('hidden');
      document.getElementById('viewHome').classList.remove('hidden');
      playBGM('home');
    }

    function confirmExitQuiz() {
      if(confirm('ホームにもどりますか？')) showHome();
    }

    loadData();
    // BGM自動再生制限回避のため、初回タップ時に初期化
    document.body.addEventListener('click', initAudio, { once: true });
  </script>
</body>
</html>
